<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - PDF Toolkit Demo</title>
    <meta name="description" content="Contact PDF Toolkit Demo for questions, feedback, or support regarding our free online PDF tools.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://example.com/contact">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .contact-form { max-width: 560px; margin: 30px auto; text-align: left; }
        .contact-form label { display: block; font-size: 14px; color: #777; margin-bottom: 6px; margin-top: 18px; }
        .contact-form input, .contact-form textarea, .contact-form select {
            width: 100%; padding: 12px 16px; font-size: 15px;
            border: 2px solid #e0e0e0; border-radius: 10px;
            font-family: Arial; box-sizing: border-box; outline: none; transition: 0.2s;
            background: white; color: #333;
        }
        .contact-form input:focus, .contact-form textarea:focus, .contact-form select:focus { border-color: #F9A825; }
        .contact-form textarea { min-height: 130px; resize: vertical; }
        .success-msg { background: #e8f5e9; color: #2e7d32; padding: 14px 20px; border-radius: 10px; margin-top: 20px; font-size: 15px; display: none; }
    </style>
</head>
<body>
{% include '_navbar.html' %}

<div class="container">
    <h1 class="page-title">Contact Us</h1>
    <p class="subtitle">We'd love to hear from you</p>

    <div class="contact-form">
        <form id="contactForm" onsubmit="submitForm(event)">
            <label>Your Name</label>
            <input type="text" placeholder="John Doe" required>

            <label>Email Address</label>
            <input type="email" placeholder="you@example.com" required>

            <label>Subject</label>
            <select>
                <option>General Question</option>
                <option>Bug Report</option>
                <option>Feature Request</option>
                <option>Privacy Concern</option>
                <option>Other</option>
            </select>

            <label>Message</label>
            <textarea placeholder="Write your message here..." required></textarea>

            <button type="submit" class="btn" style="margin-top: 24px; width: 100%;">📨 Send Message</button>
        </form>
        <div class="success-msg" id="successMsg">✅ Thank you! Your message has been sent. We'll get back to you soon.</div>
    </div>
</div>

<script>
function submitForm(e) {
    e.preventDefault();
    document.getElementById("contactForm").style.display = "none";
    document.getElementById("successMsg").style.display = "block";
}
</script>

{% include '_footer.html' %}
</body>
</html>
